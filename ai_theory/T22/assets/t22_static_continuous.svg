<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="520" viewBox="0 0 1160 520">
  <rect width="1160" height="520" fill="#ffffff"/>
  <style>
    text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #172033; }
    .title { font-size: 26px; font-weight: 700; }
    .label { font-size: 19px; font-weight: 700; }
    .small { font-size: 15px; }
    .cell { stroke: #344054; stroke-width: 1.5; rx: 5; }
  </style>

  <text x="40" y="42" class="title">同一组 A/B/C 请求：固定批次与连续批处理</text>

  <text x="40" y="100" class="label">Static batching</text>
  <text x="40" y="126" class="small">A 完成后，原位置仍要陪 B 跑到整批结束</text>

  <text x="230" y="88" class="small">step 0</text>
  <text x="350" y="88" class="small">step 1</text>
  <text x="470" y="88" class="small">step 2</text>
  <text x="590" y="88" class="small">step 3</text>
  <text x="710" y="88" class="small">step 4</text>
  <text x="830" y="88" class="small">step 5</text>
  <text x="950" y="88" class="small">step 6</text>

  <g transform="translate(210,140)">
    <rect class="cell" x="0" y="0" width="100" height="48" fill="#b9dcff"/>
    <rect class="cell" x="120" y="0" width="100" height="48" fill="#b9dcff"/>
    <rect class="cell" x="240" y="0" width="100" height="48" fill="#ffd0d0"/>
    <rect class="cell" x="360" y="0" width="100" height="48" fill="#ffd0d0"/>
    <rect class="cell" x="480" y="0" width="100" height="48" fill="#ffd0d0"/>
    <rect class="cell" x="600" y="0" width="100" height="48" fill="#ffffff" stroke-dasharray="6 5"/>
    <rect class="cell" x="720" y="0" width="100" height="48" fill="#ffffff" stroke-dasharray="6 5"/>
    <text x="50" y="31" text-anchor="middle" class="label">A</text>
    <text x="170" y="31" text-anchor="middle" class="label">A</text>
    <text x="290" y="31" text-anchor="middle" class="small">PAD</text>
    <text x="410" y="31" text-anchor="middle" class="small">PAD</text>
    <text x="530" y="31" text-anchor="middle" class="small">PAD</text>
    <text x="650" y="31" text-anchor="middle" class="small">idle</text>
    <text x="770" y="31" text-anchor="middle" class="small">idle</text>

    <rect class="cell" x="0" y="62" width="100" height="48" fill="#c5ead5"/>
    <rect class="cell" x="120" y="62" width="100" height="48" fill="#c5ead5"/>
    <rect class="cell" x="240" y="62" width="100" height="48" fill="#c5ead5"/>
    <rect class="cell" x="360" y="62" width="100" height="48" fill="#c5ead5"/>
    <rect class="cell" x="480" y="62" width="100" height="48" fill="#c5ead5"/>
    <rect class="cell" x="600" y="62" width="100" height="48" fill="#ffe6a8"/>
    <rect class="cell" x="720" y="62" width="100" height="48" fill="#ffe6a8"/>
    <text x="50" y="94" text-anchor="middle" class="label">B</text>
    <text x="170" y="94" text-anchor="middle" class="label">B</text>
    <text x="290" y="94" text-anchor="middle" class="label">B</text>
    <text x="410" y="94" text-anchor="middle" class="label">B</text>
    <text x="530" y="94" text-anchor="middle" class="label">B</text>
    <text x="650" y="94" text-anchor="middle" class="label">C</text>
    <text x="770" y="94" text-anchor="middle" class="label">C</text>
  </g>

  <text x="40" y="318" class="label">Continuous batching</text>
  <text x="40" y="344" class="small">每个 step 后完成即退，C 在 step 2 立即补位</text>

  <g transform="translate(210,360)">
    <rect class="cell" x="0" y="0" width="100" height="48" fill="#b9dcff"/>
    <rect class="cell" x="120" y="0" width="100" height="48" fill="#b9dcff"/>
    <rect class="cell" x="240" y="0" width="100" height="48" fill="#c5ead5"/>
    <rect class="cell" x="360" y="0" width="100" height="48" fill="#c5ead5"/>
    <rect class="cell" x="480" y="0" width="100" height="48" fill="#c5ead5"/>
    <text x="50" y="31" text-anchor="middle" class="label">A</text>
    <text x="170" y="31" text-anchor="middle" class="label">A</text>
    <text x="290" y="31" text-anchor="middle" class="label">B</text>
    <text x="410" y="31" text-anchor="middle" class="label">B</text>
    <text x="530" y="31" text-anchor="middle" class="label">B</text>

    <rect class="cell" x="0" y="62" width="100" height="48" fill="#c5ead5"/>
    <rect class="cell" x="120" y="62" width="100" height="48" fill="#c5ead5"/>
    <rect class="cell" x="240" y="62" width="100" height="48" fill="#ffe6a8"/>
    <rect class="cell" x="360" y="62" width="100" height="48" fill="#ffe6a8"/>
    <rect class="cell" x="480" y="62" width="100" height="48" fill="#ffffff" stroke-dasharray="6 5"/>
    <text x="50" y="94" text-anchor="middle" class="label">B</text>
    <text x="170" y="94" text-anchor="middle" class="label">B</text>
    <text x="290" y="94" text-anchor="middle" class="label">C</text>
    <text x="410" y="94" text-anchor="middle" class="label">C</text>
    <text x="530" y="94" text-anchor="middle" class="small">idle</text>
  </g>

  <rect x="840" y="372" width="24" height="18" fill="#b9dcff" stroke="#344054"/>
  <text x="874" y="387" class="small">A：2 tokens</text>
  <rect x="840" y="402" width="24" height="18" fill="#c5ead5" stroke="#344054"/>
  <text x="874" y="417" class="small">B：5 tokens</text>
  <rect x="840" y="432" width="24" height="18" fill="#ffe6a8" stroke="#344054"/>
  <text x="874" y="447" class="small">C：step 2 到达，2 tokens</text>
  <rect x="840" y="462" width="24" height="18" fill="#ffd0d0" stroke="#344054"/>
  <text x="874" y="477" class="small">PAD：无有用 token</text>
</svg>
