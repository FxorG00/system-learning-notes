<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">XOR points in the input plane</title>
  <desc id="desc">Class zero occupies the lower-left and upper-right corners. Class one occupies the other two corners.</desc>
  <rect width="760" height="460" fill="#ffffff"/>
  <text x="380" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17212b">XOR in the input plane</text>
  <line x1="150" y1="370" x2="650" y2="370" stroke="#334155" stroke-width="3"/>
  <line x1="150" y1="370" x2="150" y2="80" stroke="#334155" stroke-width="3"/>
  <path d="M650 370 l-14 -8 v16 z" fill="#334155"/>
  <path d="M150 80 l-8 14 h16 z" fill="#334155"/>
  <text x="670" y="378" font-family="Arial, sans-serif" font-size="21" fill="#17212b">x1</text>
  <text x="132" y="65" font-family="Arial, sans-serif" font-size="21" fill="#17212b">x2</text>
  <line x1="190" y1="370" x2="190" y2="360" stroke="#64748b" stroke-width="2"/>
  <line x1="590" y1="370" x2="590" y2="360" stroke="#64748b" stroke-width="2"/>
  <line x1="150" y1="330" x2="160" y2="330" stroke="#64748b" stroke-width="2"/>
  <line x1="150" y1="130" x2="160" y2="130" stroke="#64748b" stroke-width="2"/>
  <text x="186" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">0</text>
  <text x="590" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">1</text>
  <text x="124" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">0</text>
  <text x="124" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">1</text>
  <circle cx="190" cy="330" r="18" fill="#2563eb"/>
  <circle cx="590" cy="130" r="18" fill="#2563eb"/>
  <rect x="172" y="112" width="36" height="36" rx="4" fill="#f97316" transform="rotate(45 190 130)"/>
  <rect x="572" y="312" width="36" height="36" rx="4" fill="#f97316" transform="rotate(45 590 330)"/>
  <text x="218" y="338" font-family="Arial, sans-serif" font-size="19" fill="#1d4ed8">class 0  (0,0)</text>
  <text x="435" y="112" font-family="Arial, sans-serif" font-size="19" fill="#1d4ed8">class 0  (1,1)</text>
  <text x="218" y="112" font-family="Arial, sans-serif" font-size="19" fill="#c2410c">class 1  (0,1)</text>
  <text x="435" y="338" font-family="Arial, sans-serif" font-size="19" fill="#c2410c">class 1  (1,0)</text>
  <g transform="translate(238,420)">
    <circle cx="0" cy="0" r="9" fill="#2563eb"/>
    <text x="18" y="6" font-family="Arial, sans-serif" font-size="17" fill="#334155">class 0</text>
    <rect x="139" y="-9" width="18" height="18" rx="2" fill="#f97316" transform="rotate(45 148 0)"/>
    <text x="171" y="6" font-family="Arial, sans-serif" font-size="17" fill="#334155">class 1</text>
  </g>
</svg>
