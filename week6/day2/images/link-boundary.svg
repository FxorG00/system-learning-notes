<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Two Ethernet links separated by a router</title>
  <desc id="desc">Host A, Host B, a switch, and router interface r0 are in Link A. Router interface r1, another switch, and Host C are in Link B. The router forwards IP packets between the links.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#059669"/>
    </marker>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #111827; }
      .region-title { font: 700 21px Arial, sans-serif; }
      .label { font: 700 17px Arial, sans-serif; fill: #111827; }
      .small { font: 15px Arial, sans-serif; fill: #374151; }
      .note { font: 700 16px Arial, sans-serif; fill: #4b5563; }
      .device { fill: #ffffff; stroke: #4b5563; stroke-width: 2; rx: 7; }
    </style>
  </defs>

  <rect width="1200" height="500" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" class="title">A link is a local Layer-2 communication domain</text>

  <rect x="24" y="58" width="492" height="382" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="44" y="88" class="region-title" fill="#1d4ed8">Link A: Ethernet LAN</text>

  <rect x="684" y="58" width="492" height="382" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="704" y="88" class="region-title" fill="#047857">Link B: another Ethernet LAN</text>

  <rect x="58" y="122" width="152" height="70" class="device"/>
  <text x="134" y="151" text-anchor="middle" class="label">Host A</text>
  <text x="134" y="176" text-anchor="middle" class="small">interface ens33</text>

  <rect x="58" y="302" width="152" height="70" class="device"/>
  <text x="134" y="331" text-anchor="middle" class="label">Host B</text>
  <text x="134" y="356" text-anchor="middle" class="small">interface eth0</text>

  <rect x="282" y="212" width="142" height="70" class="device"/>
  <text x="353" y="241" text-anchor="middle" class="label">Switch</text>
  <text x="353" y="266" text-anchor="middle" class="small">Layer 2</text>

  <rect x="450" y="212" width="66" height="70" class="device"/>
  <text x="483" y="241" text-anchor="middle" class="label">r0</text>
  <text x="483" y="264" text-anchor="middle" class="small">interface</text>

  <rect x="516" y="172" width="168" height="150" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <text x="600" y="219" text-anchor="middle" class="label">Router</text>
  <text x="600" y="247" text-anchor="middle" class="small">checks destination IP</text>
  <text x="600" y="273" text-anchor="middle" class="small">forwards between links</text>
  <text x="600" y="301" text-anchor="middle" class="note">Layer 3 boundary</text>

  <rect x="684" y="212" width="66" height="70" class="device"/>
  <text x="717" y="241" text-anchor="middle" class="label">r1</text>
  <text x="717" y="264" text-anchor="middle" class="small">interface</text>

  <rect x="800" y="212" width="142" height="70" class="device"/>
  <text x="871" y="241" text-anchor="middle" class="label">Switch</text>
  <text x="871" y="266" text-anchor="middle" class="small">Layer 2</text>

  <rect x="990" y="212" width="152" height="70" class="device"/>
  <text x="1066" y="241" text-anchor="middle" class="label">Host C</text>
  <text x="1066" y="266" text-anchor="middle" class="small">interface eth0</text>

  <path d="M210 157 C250 157, 252 225, 282 237" fill="none" stroke="#2563eb" stroke-width="3"/>
  <path d="M210 337 C250 337, 252 269, 282 257" fill="none" stroke="#2563eb" stroke-width="3"/>
  <line x1="424" y1="247" x2="450" y2="247" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <line x1="750" y1="247" x2="800" y2="247" stroke="#059669" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="942" y1="247" x2="990" y2="247" stroke="#059669" stroke-width="3" marker-end="url(#arrow-green)"/>

  <text x="270" y="405" text-anchor="middle" class="note">Frames stay inside Link A until r0</text>
  <text x="930" y="405" text-anchor="middle" class="note">A new frame is used on Link B</text>
</svg>
